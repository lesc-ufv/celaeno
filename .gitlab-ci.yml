image: "archlinux"

stages:
  - build
  - test
  - doc

before_script:
  - pacman --noconfirm -Syu
  - pacman --noconfirm -S make cmake clang git python-pip
  - pip install conan

build:
  stage: build
  rules:
    - when: manual
      allow_failure: false
  script:
    - mkdir build && cd build
    - conan profile new default --detect
    - conan profile update settings.compiler.libcxx=libstdc++11 default
    - conan remote add pleiades https://api.bintray.com/conan/ruanformigoni/pleiades
    - conan remote add spdlog https://api.bintray.com/conan/ruanformigoni/spdlog
    - conan remote add fmt https://api.bintray.com/conan/ruanformigoni/fmt
    - conan remote add epfl https://api.bintray.com/conan/ruanformigoni/epfl
    - conan install
      -s compiler=gcc
      -s compiler.version=10
      -s compiler.libcxx=libstdc++11
      --build=missing .. && cd ..
    - cmake -H. -Bbuild
      -D CMAKE_BUILD_TYPE=Debug
      -D CMAKE_CXX_COMPILER=g++
    - cmake --build build
  artifacts:
    paths:
      - ./build/test/
    expire_in: 1 week

bfs:
  needs: ["build"]
  stage: test
  script:
    - ./build/test/test_bfs -s

dfs:
  needs: ["build"]
  stage: test
  script:
    - ./build/test/test_dfs -s

graph_balance:
  needs: ["build"]
  stage: test
  script:
    - ./build/test/test_balance

a_star:
  needs: ["build"]
  stage: test
  script:
    - ./build/test/test_a_star -s

matrix_realization:
  needs: ["build"]
  stage: test
  script:
    - ./build/test/test_m_real -s

barycenter:
  needs: ["build"]
  stage: test
  script:
    - ./build/test/test_barycenter -s

crossings:
  needs: ["build"]
  stage: test
  script:
    - ./build/test/test_crossings -s

graph_depth_view:
  needs: ["build"]
  stage: test
  script:
    - ./build/test/test_views_depth -s

graph_proximity_view:
  needs: ["build"]
  stage: test
  script:
    - ./build/test/test_views_proximity -s

pages:
  stage: doc
  before_script:
    - ''
  image: "rustlang/rust:nightly"
  script:
    - cargo install mdbook --no-default-features
    - cd ./doc/mdbook/
    - mdbook build
    - mv book ../../public
  artifacts:
    paths:
      - public
  only:
    - master
